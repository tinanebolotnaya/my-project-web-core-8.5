<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webcore_8.5</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="brands">
      <h3 class="main-header">РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ</h3>
      <div class="brands__swiper swiper">
        <div class="brands__wrapper swiper-wrapper">
          <img
            class="brands__slide swiper-slide"
            src="./images/cat1.png"
            alt=""
          />
          <img
            class="brands__slide swiper-slide"
            src="./images/cat1 copy 2.png"
            alt=""
          />
          <img
            class="brands__slide swiper-slide"
            src="./images/cat1 copy 3.png"
            alt=""
          />
          <img
            class="brands__slide swiper-slide"
            src="./images/cat1 copy.png"
            alt=""
          />
          <img
            class="brands__slide swiper-slide"
            src="./images/cat1 copy 7.png"
            alt=""
          />
          <img
            class="brands__slide swiper-slide"
            src="./images/cat1 copy 8.png"
            alt=""
          />
          <img
            class="brands__slide--extra swiper-slide"
            src="./images/cat1 copy 9.png"
            alt=""
          />
          <img
            class="brands__slide--extra swiper-slide"
            src="./images/cat1 copy 10.png"
            alt=""
          />
          <div class="swiper-slide hidden-brand">
            <img src="./images/cat1.png" alt="" />
          </div>
          <div class="swiper-slide hidden-brand">
            <img src="./images/cat1 copy.png" alt="" />
          </div>
          <div class="swiper-slide hidden-brand">
            <img src="./images/cat1 copy 2.png" alt="" />
          </div>
        </div>
        <div class="brands__pagination swiper-pagination"></div>
      </div>
      <button class="brands__button--start">
        <img src="./images/expand.png" alt="Expand" />
        <span>Показать все</span>
      </button>
      <button class="brands__button--end">
        <img src="./images/expand (1).png" alt="Collapse" />
        <span>Скрыть</span>
      </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
